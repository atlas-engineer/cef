name: CEF Compile Stage
description: Run one time-boxed CEF compilation stage and hand off build state or release artifacts

inputs:
  platform:
    description: Target platform (linux or macos)
    required: true
  stage:
    description: Current 1-based stage index
    required: true
  prev_stage:
    description: Previous stage index to resume from (empty on stage 1)
    required: false
    default: ""
  final_stage:
    description: Whether this is the last stage in the chain
    required: false
    default: "false"
  cef_branch:
    description: CEF branch number
    required: true
  cef_checkout:
    description: CEF commit hash
    required: true
  compile_minutes:
    description: Maximum compilation minutes for this stage before checkpointing
    required: false
    default: "285"

outputs:
  completed:
    description: "'true' if compilation and minimal distribution completed, 'false' if checkpointed"
    value: ${{ steps.compile.outputs.completed }}

runs:
  using: composite
  steps:
    - name: Download previous build checkpoint
      if: inputs.prev_stage != ''
      uses: actions/download-artifact@v8
      with:
        name: cef-checkpoint-${{ inputs.platform }}-${{ inputs.prev_stage }}
        path: ${{ runner.temp }}/cef-checkpoint-in

    - name: Compile CEF stage ${{ inputs.stage }}
      id: compile
      shell: bash
      env:
        CEF_PLATFORM: ${{ inputs.platform }}
        CEF_BRANCH: ${{ inputs.cef_branch }}
        CEF_CHECKOUT: ${{ inputs.cef_checkout }}
        COMPILE_MINUTES: ${{ inputs.compile_minutes }}
        FINAL_STAGE: ${{ inputs.final_stage }}
        CHECKPOINT_IN: ${{ inputs.prev_stage != '' && format('{0}/cef-checkpoint-in/cef-out.tar.zst', runner.temp) || '' }}
        CHECKPOINT_OUT: ${{ runner.temp }}/cef-checkpoint-out/cef-out.tar.zst
        DIST_OUT: ${{ runner.temp }}/cef-dist-out
      run: bash "$GITHUB_WORKSPACE/scripts/ci-build-stage.sh"

    - name: Upload build checkpoint for next stage
      if: steps.compile.outputs.completed == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: cef-checkpoint-${{ inputs.platform }}-${{ inputs.stage }}
        path: ${{ runner.temp }}/cef-checkpoint-out/cef-out.tar.zst
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

    - name: Upload minimal release distribution
      if: steps.compile.outputs.completed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: cef-dist-${{ inputs.platform }}
        path: ${{ runner.temp }}/cef-dist-out/*
        compression-level: 0
        retention-days: 5
        if-no-files-found: error

    - name: Delete superseded checkpoint artifact
      if: inputs.prev_stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PREV_ARTIFACT: cef-checkpoint-${{ inputs.platform }}-${{ inputs.prev_stage }}
      run: |
        artifact_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --paginate --jq ".artifacts[] | select(.name == \"${PREV_ARTIFACT}\") | .id" || true)
        for id in $artifact_ids; do
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
        done
